name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # CI builds are ad-hoc signed; hardened runtime is skipped so the test bundle can load
      # into the ad-hoc signed host app.
      - name: Test
        run: >
          xcodebuild test
          -project Lavboard.xcodeproj
          -scheme Lavboard
          -destination 'platform=macOS'
          -derivedDataPath build
          ENABLE_HARDENED_RUNTIME=NO

      # Each mic system module (and the shared kit) carries its own tests.
      - name: Test mic system packages
        run: |
          for package in Packages/*/; do
            echo "::group::$package"
            swift test --package-path "$package"
            echo "::endgroup::"
          done

      # The packages also build for iOS, where receivers' control channels go through External Accessory.
      - name: Build mic system packages for iOS
        run: |
          for package in Packages/*/; do
            name=$(basename "$package")
            scheme=$name
            if (cd "$package" && xcodebuild -list | grep -q "$name-Package"); then scheme="$name-Package"; fi
            echo "::group::$package"
            (cd "$package" && xcodebuild build -quiet -scheme "$scheme" -destination 'generic/platform=iOS Simulator' -derivedDataPath ../../build/packages-ios)
            echo "::endgroup::"
          done

      - name: Build Release
        run: >
          xcodebuild build
          -project Lavboard.xcodeproj
          -scheme Lavboard
          -configuration Release
          -derivedDataPath build
