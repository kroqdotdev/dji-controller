name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Plug in the receiver
        2. Switch to 4-track
        3. ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Receiver mode
      options:
        - 4-track
        - Mono
        - Stereo
        - Not sure
  - type: input
    id: firmware
    attributes:
      label: Receiver and transmitter firmware
      description: Shown in the DJI Mimo app.
      placeholder: 30.00.03.00
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run `log show --last 10m --predicate 'subsystem == \"com.sauerdev.djicontroller\"'` and paste the output."
      render: text
