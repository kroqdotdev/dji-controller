name: Lavboard
options:
  bundleIdPrefix: com.sauerdev
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
  # Wireless mic support: the shared contract, then one package per mic system.
  MicSystemKit:
    path: Packages/MicSystemKit
  DJIMicMini2S:
    path: Packages/DJIMicMini2S
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
targets:
  Lavboard:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lavboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: Lavboard listens to your wireless receivers and other mics to meter, mix and record them.
        NSAudioCaptureUsageDescription: Lavboard records what the apps you add as tracks play, to mix them into your stream and recordings.
        # Updates (Sparkle): the feed is always the newest published release's appcast.xml.
        SUFeedURL: https://github.com/kroqdotdev/lavboard/releases/latest/download/appcast.xml
        SUPublicEDKey: MubnxR8CJ6FdaPkJdjQTL4zoIS4fZvJYqfdBhSW9xT8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUVerifyUpdateBeforeExtraction: true
    entitlements:
      path: App/Lavboard.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sauerdev.lavboard
        PRODUCT_NAME: Lavboard
        PRODUCT_MODULE_NAME: Lavboard
        # Release version; scripts/release.sh overrides it per release.
        MARKETING_VERSION: 0.1.3
        CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
        SWIFT_OBJC_BRIDGING_HEADER: App/Audio/AudioCore-Bridging.h
        # Hardened runtime blocks code injection, so nothing can borrow the app's microphone permission.
        ENABLE_HARDENED_RUNTIME: YES
        GCC_OPTIMIZATION_LEVEL: 3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug builds have their own identity, so they keep their own settings and microphone
        # permission and never disturb an installed release copy.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.sauerdev.lavboard.debug
    dependencies:
      - package: Sparkle
      - package: MicSystemKit
      - package: DJIMicMini2S
      - target: LavboardStream
        embed: true
        codeSign: false
        copy:
          destination: resources
  LavboardStream:
    type: bundle
    platform: macOS
    sources:
      - path: Vendor/BlackHole/BlackHole.c
      - path: Driver/StreamDriverConfig.h
        buildPhase: none
    info:
      path: Driver/Info.plist
      properties:
        CFBundleDevelopmentRegion: English
        CFBundleName: LavboardStream
        CFBundleShortVersionString: "0.7.1"
        CFBundleVersion: "1"
        CFPlugInFactories:
          b1d23d06-ac22-4aed-8b28-511a4b8bdb89: BlackHole_Create
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB: [b1d23d06-ac22-4aed-8b28-511a4b8bdb89]
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_NAME: LavboardStream
        PRODUCT_BUNDLE_IDENTIFIER: com.sauerdev.lavboard.stream
        WRAPPER_EXTENSION: driver
        INSTALL_PATH: /Library/Audio/Plug-Ins/HAL
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        GCC_OPTIMIZATION_LEVEL: s
        OTHER_CFLAGS: ["-include", "$(SRCROOT)/Driver/StreamDriverConfig.h"]
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
  LavboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Lavboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sauerdev.lavboard.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Audio/AudioCore-Bridging.h
schemes:
  Lavboard:
    build:
      targets:
        Lavboard: all
        LavboardTests: [test]
    test:
      targets:
        - LavboardTests
